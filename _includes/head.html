<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}" />
    <meta property="og:description" content="{{ site.description }}" />
    <meta property="og:url" content="https://xozhanglab.com/" />
    <meta property="og:image" content="https://xozhanglab.com/images/icons/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/style.css' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/icons/favicon/apple-touch-icon.png' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/icons/favicon/favicon-32x32.png' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/images/icons/favicon/favicon-16x16.png' | relative_url }}" />
    <link rel="canonical" href="https://xozhanglab.com{{ page.url }}" />
    {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
    <link rel="manifest" href="{{ '/images/icons/favicon/site.webmanifest' | relative_url }}" />
    <!-- Marks that scripts are available; reveal animations only hide content
         when this class is present, so the page stays readable without JS.
         The URLs above are root-absolute on purpose: GitHub Pages serves this
         page for ANY unmatched path, so a nested 404 ("/team/zhangxiaoou")
         would resolve "images/..." against the wrong directory. -->
    <script>
        document.documentElement.className += ' js';
        /* Fail-safe for the opposite failure: scripts are available, so the
           content is hidden, but site.js never loads or throws on parse.
           Without this every [data-reveal] block stays at opacity 0 and the
           page looks empty. site.js adds "js-ready" as its first statement,
           so reaching this timeout means it never ran. */
        window.addEventListener('load', function () {
            setTimeout(function () {
                if (!document.documentElement.classList.contains('js-ready')) {
                    document.documentElement.classList.remove('js');
                }
            }, 1500);
        });
    </script>
</head>
