<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ site.title }}" />
    <meta property="og:description" content="{{ site.description }}" />
    <meta property="og:url" content="https://xozhanglab.com/" />
    <meta property="og:image" content="https://xozhanglab.com/images/icons/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="assets/css/style.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/icons/favicon/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/icons/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="images/icons/favicon/favicon-16x16.png" />
    <link rel="canonical" href="https://xozhanglab.com{{ page.url }}" />
    {% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
    <link rel="manifest" href="images/icons/favicon/site.webmanifest" />
    <!-- Marks that scripts are available; reveal animations only hide content
         when this class is present, so the page stays readable without JS. -->
    <script>document.documentElement.className += ' js';</script>
</head>
