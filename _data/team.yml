- name: Zhongren Hu
  role: PhD Student
  pic: /images/team/huzhongren.jpg
  email: 2011399@tongji.edu.cn
  bio: |
    Zhongren earned his B.S. in Bioinformatics from Tongji University in 2020 and joined Professor
    Zhang's lab as a doctoral student the same year. His research focuses on developing
    computational methods to detect transposition events from long-read sequencing data.
- name: Bo Xu
  role: PhD Candidate
  pic: /images/team/xubo.jpg
  email: 1194189468@qq.com
  bio: |
    Bo received his B.S. in Bioinformatics from Tongji University in 2020 and is now a Ph.D.
    candidate in Biology there, expected to graduate in 2026. He profiles transposon insertions in
    both human and fly, and studies the conservation of piRNA clusters over mammalian evolution.
    Ultimately, he aims to understand how piRNA clusters silence transposon insertions and regulate
    gene expression.
- name: Hanxi Shi
  role: PhD Student
  pic: /images/team/shihanxi.jpg
  email: 2111266@tongji.edu.cn
  bio: |
    Hanxi earned her B.S. in Biology from Tongji University in 2021 and joined Professor Zhang's lab
    to pursue her Ph.D. Her research focuses on the mechanisms by which transposable elements (TEs)
    contribute to the regulation of gene expression.
- name: Ruofan Huang
  role: PhD Student
  pic: /images/team/huangruofan.jpg
  email: ruofanhuang@tongji.edu.cn
  bio: |
    Ruofan received her B.E. in Biological Engineering from Beijing University of Chemical
    Technology in 2021 and began her Ph.D. with Professor Zhang at Tongji University the same year.
    She studies the biogenesis, processing and gene regulation of small noncoding RNAs, with a
    particular interest in how noncoding sequences contribute to human health and disease.
- name: Lingfeng Xu
  role: PhD Student
  pic: /images/team/xulingfeng.jpg
  email: 2311465@tongji.edu.cn
  bio: |
    I studied bioinformatics as an undergraduate at Tongji University, where I carried out a
    preliminary study of circular RNAs. I am now a graduate student in Professor Xiao-Ou Zhang's
    lab, working with single-cell sequencing data. I am deeply interested in biology and machine
    learning, and I am always happy to discuss ideas.
- name: Mengyao Cui
  role: PhD Student
  pic: /images/team/cuimengyao.jpg
  email: 2311459@tongji.edu.cn
  bio: |
    Mengyao received her B.S. in Applied Statistics from Northeastern University in 2023 and joined
    Professor Zhang's lab for her Ph.D. She is drawn to research that brings mathematics and biology
    together, and hopes to make a meaningful contribution in that space.
- name: Jing Yan
  role: PhD Student
  pic: /images/team/yanjing.jpg
  email: 2333161@tongji.edu.cn
  bio: |
    Jing graduated from Huazhong Agricultural University in 2023 with a B.S. in Bioinformatics and
    joined Professor Zhang's lab to pursue a Ph.D. degree. She is drawn to unexplored questions
    in biology and to developing innovative approaches to difficult problems, and she continues to
    broaden her research skills in pursuit of her scientific goals.
- name: Yubo Liu
  role: PhD Student
  pic: /images/team/liuyubo.jpg
  email: 2433326@tongji.edu.cn
  bio: |
    I graduated from Tongji University in 2024 with a B.S. in Bioinformatics and then joined
    Professor Xiao-Ou Zhang's team. My work focuses on quantifying transposons at the single-cell
    level and on developing algorithms for that purpose. I am always glad to exchange ideas.
- name: Siyu Xu
  role: Master's Student
  pic: /images/team/xusiyu.jpg
  email: syxu0912@tongji.edu.cn
  bio: |
    Siyu received her B.S. in Bioinformatics from Soochow University in 2024 and is pursuing her
    Master's degree in Biology with Professor Xiao-Ou Zhang at Tongji University. She uses scRNA-seq
    data to identify transcription start sites (TSSs) and to explore their role in cellular
    phenotypes and regulatory programs. She hopes to deepen our understanding of transcriptional
    regulation and to open new approaches to related diseases.
- name: Junru Wang
  role: PhD Student
  pic: /images/team/wangjunru.jpg
  email: 2511592@tongji.edu.cn
  bio: |
    Junru earned her B.S. in Bioinformatics from Tongji University in 2025 and joined the lab to
    pursue her Ph.D. Her research centers on circular RNAs and single-cell sequencing, and she aims
    to address practical biological questions through algorithm development and data analysis.
- name: Yue Shi
  role: Master's Student
  pic: /images/team/shiyue.jpg
  email: 2533126@tongji.edu.cn
  bio: |
    Yue received his B.S. in Bioinformatics from Harbin Medical University in 2025 and is now
    pursuing a Master's degree in Biology with Professor Xiao-Ou Zhang at Tongji University. His
    current work focuses on transcription start sites (TSSs) and their regulatory impact.